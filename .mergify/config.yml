# Backport policy for rcl_logging_syslog.
#
# The ABI check (.github/workflows/abi.yaml, ros2-abi-action) labels every PR
# against rolling with either "ABI compatible" or "ABI break". Those labels
# drive the backport flags below (REP-0009: released distributions must not
# break ABI):
#
#   "ABI compatible" -> backport-all   -> backported to every supported distro
#   "ABI break"      -> skip-backport  -> not backported anywhere
#
# Maintainers can still override by hand:
#   - narrow the targets: remove backport-all and add backport-<distro>,
#   - stop a backport:    add skip-backport,
#   - force a backport of an ABI break: remove the "ABI break" label, then
#     remove skip-backport and add the wanted backport-* label(s).
# A PR that has no ABI verdict is not backported unless it is labeled.

pull_request_rules:
  - name: flag backport-all when the ABI check reports a compatible change
    description: |
      An ABI compatible change is safe for every released distribution, so it
      is flagged for backport to all supported branches. Explicit backport-*
      or skip-backport labels set by a maintainer are left untouched.
    conditions:
      - base=rolling
      - "label=ABI compatible"
      - "label!=ABI break"
      - label!=skip-backport
      - -label~=^backport-
    actions:
      label:
        add:
          - backport-all

  - name: flag skip-backport when the ABI check reports a breaking change
    description: |
      An ABI breaking change must not land on a released distribution, so any
      backport flag is cleared and the PR is marked skip-backport.
    conditions:
      - base=rolling
      - "label=ABI break"
    actions:
      label:
        add:
          - skip-backport
        remove:
          - backport-all
          - backport-lyrical
          - backport-kilted
          - backport-jazzy
          - backport-humble

  - name: backport to all supported distributions
    description: |
      This rule backports a PR to all supported distribution branches when it
      is merged with the backport-all label (set by the ABI check or by hand).
    conditions:
      - base=rolling
      - label=backport-all
      - merged
      - label!=skip-backport  # Do not backport if this label exists
      - "label!=ABI break"    # Never backport an ABI breaking change
    actions:
      backport:
        branches:
          - lyrical
          - kilted
          - jazzy
          - humble

  - name: backport to lyrical at reviewers discretion
    description: |
      This rule backports a PR to the lyrical distribution branch when it is labeled.
    conditions:
      - base=rolling
      - label=backport-lyrical
      - merged
      - label!=skip-backport  # Do not backport if this label exists
      - "label!=ABI break"    # Never backport an ABI breaking change
    actions:
      backport:
        branches:
          - lyrical

  - name: backport to kilted at reviewers discretion
    description: |
      This rule backports a PR to the kilted distribution branch when it is labeled.
    conditions:
      - base=rolling
      - label=backport-kilted
      - merged
      - label!=skip-backport  # Do not backport if this label exists
      - "label!=ABI break"    # Never backport an ABI breaking change
    actions:
      backport:
        branches:
          - kilted

  - name: backport to jazzy at reviewers discretion
    description: |
      This rule backports a PR to the jazzy distribution branch when it is labeled.
    conditions:
      - base=rolling
      - label=backport-jazzy
      - merged
      - label!=skip-backport  # Do not backport if this label exists
      - "label!=ABI break"    # Never backport an ABI breaking change
    actions:
      backport:
        branches:
          - jazzy

  - name: backport to humble at reviewers discretion
    description: |
      This rule backports a PR to the humble distribution branch when it is labeled.
    conditions:
      - base=rolling
      - label=backport-humble
      - merged
      - label!=skip-backport  # Do not backport if this label exists
      - "label!=ABI break"    # Never backport an ABI breaking change
    actions:
      backport:
        branches:
          - humble
